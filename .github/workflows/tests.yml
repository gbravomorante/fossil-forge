name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libraries for MeshLab
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff
          npm ci
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
